events { worker_connections 1024; }

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile     on;

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index landing.html;

    # Proxy all API calls to the Spring Boot backend
    location /api/ {
      # Answer preflight requests directly — nginx strips backend CORS headers
      if ($request_method = OPTIONS) {
        add_header 'Access-Control-Allow-Origin'      "$http_origin" always;
        add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Content-Length' 0;
        return 204;
      }

      # Hide backend CORS headers so we don't duplicate them
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_hide_header Access-Control-Allow-Credentials;

      # Add CORS headers for all actual requests
      add_header 'Access-Control-Allow-Origin'      "$http_origin" always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;

      proxy_pass         http://backend:8080;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Serve the landing page for everything else
    location / {
      try_files $uri $uri/ /landing.html;
    }
  }
}
