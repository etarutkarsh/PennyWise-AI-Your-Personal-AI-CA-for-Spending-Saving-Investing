# Runs the whole backend stack (Postgres + Redis + the Spring Boot app)
# in containers so nothing needs to be installed on the host machine.
#
# Usage:
#   cp .env.example .env      # first time only, then edit values if you want
#   docker compose up --build
#
# The API will be reachable at http://localhost:8080/api
# (health check: http://localhost:8080/api/actuator/health)

services:
  # Serves landing page + Flutter web app at http://localhost, proxies /api → Spring Boot
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./mobile/build/web:/usr/share/nginx/html:ro
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pennywise
      POSTGRES_USER: ${DB_USERNAME:-pennywise}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pennywise}
    ports:
      - "5432:5432"
    volumes:
      - pennywise_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pennywise} -d pennywise"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pennywise
      DB_USERNAME: ${DB_USERNAME:-pennywise}
      DB_PASSWORD: ${DB_PASSWORD:-pennywise}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env — run: openssl rand -base64 48}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Paste your Fast2SMS API key in .env to enable real SMS OTPs.
      # Sign up free at https://www.fast2sms.com → Dev API → copy key.
      # Leave empty to stay in dev mode (OTP logged to console only).
      FAST2SMS_API_KEY: ${FAST2SMS_API_KEY:-}
    ports:
      - "8080:8080"

volumes:
  pennywise_pgdata:
