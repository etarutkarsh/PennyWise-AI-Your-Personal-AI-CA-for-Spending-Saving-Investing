name: pennywise_ai
description: "PennyWise AI - Your Personal AI CA for Spending, Saving & Investing"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1

  # Dependency injection
  get_it: ^7.6.7

  # Local storage / secure storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  intl: ^0.19.0

  # OCR (Feature: Receipt OCR)
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.1.2

  # SMS auto-capture (Android only)
  flutter_sms_inbox: ^1.0.5
  permission_handler: ^13.0.0
  another_telephony: ^0.4.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
  fonts: []
